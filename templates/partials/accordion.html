{% comment %}Usage: {% include 'partials/accordion.html' with faqs=service.faqs %}{% endcomment %}
<div class="divide-y divide-ink-950/10 border-t border-b border-ink-950/10">
  {% for item in faqs %}
  <details class="group py-5">
    <summary class="flex items-center justify-between gap-4 cursor-pointer list-none font-bold text-ink-950 text-base">
      {{ item.q }}
      <i class="ph-duotone ph-plus text-cargo-600 text-lg flex-shrink-0 group-open:hidden" aria-hidden="true"></i>
      <i class="ph-duotone ph-minus text-cargo-600 text-lg flex-shrink-0 hidden group-open:inline" aria-hidden="true"></i>
    </summary>
    <p class="text-sm text-ink-950/60 leading-relaxed mt-3 pr-8">{{ item.a }}</p>
  </details>
  {% endfor %}
</div>
