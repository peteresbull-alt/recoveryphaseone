<section class="bg-white py-16 lg:py-20 px-6 lg:px-10 border-y border-ink-950/10">
  <div class="max-w-[1200px] mx-auto">
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-8 lg:gap-6">
      {% for stat in stats %}
      <div class="text-center reveal {% cycle '' 'delay-100' 'delay-200' 'delay-300' %}">
        <p class="font-display text-4xl lg:text-5xl font-bold text-ink-950 mb-2">{{ stat.value }}</p>
        <p class="text-sm text-ink-950/50">{{ stat.label }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
