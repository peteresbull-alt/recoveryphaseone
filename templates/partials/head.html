{% load static %}
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#04070F" />
<meta name="robots" content="index, follow" />

<!-- Favicons / app icons (generated from the Vaultreck mark) -->
<link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}" />
<link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon-16x16.png' %}" />
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32x32.png' %}" />
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}" />
<link rel="icon" type="image/png" sizes="192x192" href="{% static 'img/android-chrome-192x192.png' %}" />
<link rel="icon" type="image/png" sizes="512x512" href="{% static 'img/android-chrome-512x512.png' %}" />
<link rel="manifest" href="{% static 'site.webmanifest' %}" />

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ["Poppins", "system-ui", "-apple-system", "sans-serif"],
          display: ["Poppins", "system-ui", "sans-serif"],
        },
        colors: {
          ink: {
            950: "#04070F",
            900: "#080D1A",
            850: "#0A1120",
            800: "#0F1830",
            700: "#16213D",
            600: "#1E2C4D",
            500: "#2A3B63",
          },
          cargo: {
            300: "#FCD34D",
            400: "#FBBF24",
            500: "#F59E0B",
            600: "#D97706",
            700: "#B45309",
          },
          mist: "#AEB9D4",
        },
      },
    },
  };
</script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

<!-- Font Awesome (brand/social logos only — see Phosphor Icons below for everything else) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

<!-- Phosphor Icons (duotone) — the site's primary icon set: modern, distinctive, not the generic solid glyphs everyone else uses -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/duotone/style.css" />

<style>
  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  html { scroll-behavior: smooth; color-scheme: light; }
  body { font-family: "Poppins", sans-serif; background: #ffffff; }

  select option { background-color: #ffffff; color: #04070F; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #F1F2F5; }
  ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #FBBF24, #D97706); border-radius: 3px; }

  .font-display { font-family: "Poppins", sans-serif; }

  .text-cargo-gradient {
    background: linear-gradient(135deg, #FDE68A 0%, #FBBF24 45%, #F59E0B 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }

  .glass {
    background: rgba(255,255,255,0.035);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
  }

  .noise {
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  .grid-pattern {
    background-image: linear-gradient(rgba(245,158,11,1) 1px, transparent 1px), linear-gradient(90deg, rgba(245,158,11,1) 1px, transparent 1px);
    background-size: 72px 72px;
    opacity: 0.035;
  }
  .dot-pattern {
    background-image: radial-gradient(circle, #F59E0B 1px, transparent 1px);
    background-size: 44px 44px;
    opacity: 0.03;
  }

  .route-line {
    stroke-dasharray: 6 6;
    animation: dash 30s linear infinite;
  }
  @keyframes dash { to { stroke-dashoffset: -400; } }

  .hover-lift { transition: transform .4s cubic-bezier(.23,1,.32,1), box-shadow .4s ease, border-color .4s ease; }
  .hover-lift:hover { transform: translateY(-6px); box-shadow: 0 24px 48px -12px rgba(0,0,0,0.55); }

  .underline-hover { position: relative; }
  .underline-hover::after {
    content: ""; position: absolute; bottom: -2px; left: 0; width: 0; height: 1px;
    background: #FBBF24; transition: width .3s ease;
  }
  .underline-hover:hover::after { width: 100%; }

  .reveal { opacity: 0; transform: translateY(28px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.visible { opacity: 1; transform: translateY(0); }
  .delay-100 { transition-delay: .1s; } .delay-200 { transition-delay: .2s; }
  .delay-300 { transition-delay: .3s; } .delay-400 { transition-delay: .4s; } .delay-500 { transition-delay: .5s; }

  @keyframes float-up { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-10px);} }
  .float-card { animation: float-up 6s ease-in-out infinite; }
  .float-card-delayed { animation: float-up 7s ease-in-out 1s infinite; }

  @keyframes ping-slow { 0% { transform: scale(1); opacity:.6;} 75%,100% { transform: scale(2); opacity:0;} }
  .animate-ping-slow { animation: ping-slow 3s cubic-bezier(0,0,.2,1) infinite; }

  @keyframes marquee { from { transform: translateX(0);} to { transform: translateX(-50%);} }
  .animate-marquee { animation: marquee 40s linear infinite; }

  @keyframes shimmer { 0% { background-position: -200% 0;} 100% { background-position: 200% 0;} }
  .badge-shimmer {
    background: linear-gradient(90deg, rgba(245,158,11,0.08) 0%, rgba(245,158,11,0.22) 50%, rgba(245,158,11,0.08) 100%);
    background-size: 200% 100%; animation: shimmer 2.5s infinite;
  }

  .gradient-border-anim { position: relative; isolation: isolate; }
  .gradient-border-anim::before {
    content: ""; position: absolute; inset: -1px; background: linear-gradient(135deg, #F59E0B, #B45309, #F59E0B);
    background-size: 200% 200%; border-radius: inherit; z-index: -1;
    animation: gradient-border-spin 4s linear infinite; opacity: 0; transition: opacity .3s;
  }
  @keyframes gradient-border-spin { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
  .gradient-border-anim:hover::before { opacity: .35; }

  #mobileMenu { max-height: 0; overflow: hidden; opacity: 0; transition: max-height .4s ease, opacity .3s ease; }
  #mobileMenu.open { max-height: 500px; opacity: 1; }

  .faq-answer { max-height: 0; overflow: hidden; transition: max-height .4s ease; }
  .faq-answer.open { max-height: 320px; }

  .step-connector { display: none; }
  @media (min-width: 1024px) {
    .step-connector { display: block; position: absolute; top: 64px; left: 50%; width: 100%; height: 1px; background: linear-gradient(90deg, rgba(245,158,11,.35), transparent); }
  }

  @media (max-width: 640px) {
    .text-7xl, .text-8xl { font-size: 2.6rem !important; line-height: 1.08 !important; }
    .text-6xl { font-size: 2.1rem !important; }
    .text-5xl { font-size: 1.85rem !important; }
  }

  .mobile-nav { transform: translateX(100%); transition: transform .3s ease; }
  .mobile-nav.open { transform: translateX(0); }

  #site-header.is-scrolled .header-inner { height: 4.25rem; }
  #site-header.is-scrolled { box-shadow: 0 4px 24px -8px rgba(4,7,15,0.14); }

  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid #F59E0B; outline-offset: 2px;
  }

  .skip-link { position: absolute; left: -9999px; top: 0; z-index: 100; }
  .skip-link:focus { left: 1rem; top: 1rem; background: #04070F; color: #fff; padding: .75rem 1.25rem; border-radius: 2px; }

  #toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 200; display: flex; flex-direction: column; gap: .75rem; max-width: calc(100vw - 2rem); }
  .toast { display: flex; align-items: flex-start; gap: .75rem; background: #fff; border: 1px solid rgba(4,7,15,0.1); border-radius: 1rem; box-shadow: 0 12px 32px -8px rgba(4,7,15,0.18); padding: 1rem 1.25rem; min-width: 280px; max-width: 360px; opacity: 0; transform: translateY(12px) scale(.98); transition: opacity .3s ease, transform .3s ease; }
  .toast.toast-visible { opacity: 1; transform: translateY(0) scale(1); }
  @media (max-width: 480px) { #toast-container { left: 1rem; right: 1rem; } .toast { min-width: 0; max-width: none; } }
</style>
